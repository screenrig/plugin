interface:
  display_name: "ScreenRig"
  short_description: "Operate ScreenRig with the bundled CLI"
  default_prompt: "Use $screenrig to compose local stills, upload media, write playlists, place adslot breaks, assign content to my screens, or buy and sell advertising where my project is permitted, with machine-readable output."

dependencies:
  tools:
    - type: "mcp"
      value: "screenrig-views"
      description: "Show screenRIG screens, playlists and media with interactive cards after OAuth authorization."
      transport: "streamable_http"
      url: "https://api.screenrig.ai/mcp"
